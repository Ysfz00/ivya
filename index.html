<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ivya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #111;
    }

    .container {
      max-width: 400px;
      padding: 20px;
    }

    img {
      max-width: 160px; /* adjust depending on your logo */
      width: 100%;
      height: auto;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 500;
      margin: 0 0 10px;
      letter-spacing: 1px;
    }

    p {
      font-size: 14px;
      color: #666;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="logo.jpg" alt="ivya logo">

    <h1>ivya</h1>
    <p>Launching soon</p>
  </div>
</body>
</html>
